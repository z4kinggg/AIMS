<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c111d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timetable">
  <title>My Timetable</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/logos/epita.webp" as="image">
  <link rel="preload" href="/logos/emn.webp" as="image">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- First visit: pick French group -->
  <section id="onboard" class="screen center" hidden>
    <div class="panel narrow">
      <div class="brand-logos small"><img src="/logos/epita.webp" alt="EPITA" width="59" height="40"><span aria-hidden="true">+</span><img src="/logos/emn.webp" alt="EM Normandie" width="40" height="40" class="emn"></div>
      <h1>Your French group</h1>
      <p class="muted">Classes for the other French groups will be hidden. You can change this later in <b>Me</b>.</p>
      <div class="group-grid" id="onboardGroups"></div>
      <button class="btn ghost block" id="skipGroup" type="button">I don't have French classes</button>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="top">
      <div class="top-row">
        <button class="month" id="monthLabel" type="button" aria-label="Go to today"></button>
        <div class="top-actions">
          <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="pill-btn" id="todayBtn" type="button">Today</button>
        </div>
      </div>
      <div class="week-strip" id="weekStrip">
        <button class="nav-arrow" id="prevWeek" type="button" aria-label="Previous week">‹</button>
        <div class="days" id="days" role="tablist"></div>
        <button class="nav-arrow" id="nextWeek" type="button" aria-label="Next week">›</button>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Views">
      <button type="button" data-tab="day" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Day</span>
      </button>
      <button type="button" data-tab="week" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Week</span>
      </button>
      <button type="button" data-tab="me" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Me</span>
      </button>
    </nav>
  </div>

  <!-- Bottom sheet for class details -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <div class="grabber" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
  <!-- Vercel Web Analytics (turn it on in the Vercel dashboard → Analytics) -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
